<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DualLink Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="standalone-wrapper">
    <div class="action-card" style="max-width: 420px; text-align: left;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="width: 50px; height: 50px; font-size: 1.6rem; margin: 0 auto 1rem;">🔒</div>
            <h2>Admin Login</h2>
            <p style="font-size: 0.9rem; color: var(--text-secondary);">Login to access the Admin Panel.</p>
        </div>

        <div id="errorAlert" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.8rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;">
            <!-- Error message inserted here -->
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" value="admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" value="123" required>
            </div>

            <button type="submit" class="btn btn-indigo btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
                🔑 Sign In to Admin Panel
            </button>
        </form>

        <div style="margin-top: 1.5rem; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-light); padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: 0.8rem; color: var(--text-muted);">
            <div style="font-weight: 600; color: var(--text-secondary); margin-bottom: 0.2rem;">Default Admin Credentials:</div>
            <div>Username: <code style="color: #67e8f9;">admin</code></div>
            <div>Password: <code style="color: #67e8f9;">123</code></div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="./" style="font-size: 0.85rem; color: var(--text-muted);">← Back to Home Page</a>
        </div>
    </div>
</div>

<script src="db.js"></script>
<script src="app.js"></script>
<script>
    // Redirect if already logged in
    if (DB.auth.isAuthenticated()) {
        window.location.href = 'admin';
    }

    function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorAlert = document.getElementById('errorAlert');

        const result = DB.auth.login(username, password);
        if (result.success) {
            showToast("Login successful! Redirecting...");
            setTimeout(() => {
                window.location.href = 'admin';
            }, 500);
        } else {
            errorAlert.innerText = '⚠️ ' + result.message;
            errorAlert.style.display = 'block';
        }
    }
</script>

</body>
</html>
